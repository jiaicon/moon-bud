# 月芽生产站点：H5 静态 + /api 反向代理。
#
# 装法（在服务器上）：
#   sudo cp moonbud.conf /etc/nginx/conf.d/moon-bud.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 文件名沿用服务器上已有的 moon-bud.conf（ubuntu 那份备份在
# /home/ubuntu/moon-bud.conf.bak-2026-10-21：内容是从 hexo 博客配置拷来的，
# location / 指向 /home/workspace/hexo，没有 /api 转发，直接覆盖掉）。
#
# 风格对齐服务器上其它站点：conf.d 单文件、证书放 /etc/nginx/conf.d/ssl/<域名>_nginx/、
# 80 只做 301。

upstream moonbud_api {
    # 3100 而不是 3000：这台机器上已经有别的应用占着宿主 3000，
    # compose.prod.yml 因此把 API 映射到 127.0.0.1:3100。改了那边要一起改这里。
    server 127.0.0.1:3100;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name yueya.iconmen.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name yueya.iconmen.top;

    ssl_certificate     /etc/nginx/conf.d/ssl/yueya.iconmen.top_nginx/yueya.iconmen.top_bundle.pem;
    ssl_certificate_key /etc/nginx/conf.d/ssl/yueya.iconmen.top_nginx/yueya.iconmen.top.key;
    # 1m 是被迫的：服务器上其它站点已经声明了 shared:SSL:1m，同名的共享内存区
    # 各文件尺寸必须一致，写 10m 会让 nginx -t 直接 emerg 拒绝整份配置。
    ssl_session_cache   shared:SSL:1m;
    ssl_session_timeout 5m;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    root /var/www/moonbud/h5;
    index index.html;

    # H5 现在是 hash 路由，兜底其实用不上；留着是因为邀请链接指向 /#/pages/join/index，
    # 而以后若改成 history 路由，这一行就是唯一的兜底，别删。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源带内容哈希，可以命中长缓存；index.html 必须每次回源，
    # 否则改版后用户拿旧 index.html、里面的哈希又已经不存在，表现是白屏。
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 不带 URI 的 proxy_pass 是刻意的：Nest 自己挂了全局前缀 api，
    # 写成 proxy_pass http://moonbud_api/; 会把 /api 剥掉，全线 404。
    location /api/ {
        proxy_pass http://moonbud_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Swagger 挂在 /api/docs，公网可见（不泄露凭据，但把路由表摊开了）。
    # 要挡掉就把下面三行的注释去掉，只留你自己的 IP。
    # location /api/docs {
    #     allow 你的办公网IP;
    #     deny all;
    # }
}
